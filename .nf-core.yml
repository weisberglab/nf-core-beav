repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - assets/sendmail_template.txt
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml

template:
  org: nf-core
  name: beav
  description: nf-core/beav(Bacterial Element Annotation reVamped) is a bioinformatics
    pipeline that takes bacteria sequences, either raw fasta sequences or from genbank,
    and annotates them to highlight bacterial elements. The output are 3 annotated
    sequece files in different common formats, and a Circos plot with the annotations
    shown. Tools specific to agrobacterium are also optionally available.
  author: amnalert, jewell-bug, acarafat, alexweisberg
  version: 1.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  is_nfcore: true
